<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>標誌提案｜救恩辦館有限公司</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../tokens.css" />
  <style>
    body { margin: 0; background: var(--color-paper); color: var(--color-ink); font-family: var(--font-sans); }
    .wrap { width: min(1080px, calc(100% - 40px)); margin: 0 auto; padding: 36px 0 64px; }
    .banner {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--color-copper-deep); color: var(--color-paper);
      border-radius: var(--radius-pill); padding: 6px 12px; font-size: 13px; letter-spacing: 0.08em;
    }
    h1 { font-family: "Noto Serif TC", serif; font-weight: 600; font-size: clamp(36px, 5vw, 56px); margin: 14px 0 8px; }
    p { color: var(--color-ink-soft); max-width: 42rem; }
    .stage { display: grid; gap: 16px; margin-top: 28px; }
    @media (min-width: 800px) { .stage { grid-template-columns: 1.3fr 0.7fr; } }
    .card { border-radius: var(--radius-xl); padding: 36px 28px; display: grid; align-content: center; min-height: 280px; }
    .light { background: var(--color-paper-raised); border: 1px solid var(--line); }
    .dark { background: var(--color-night); }
    img.lock { width: min(100%, 460px); height: auto; }
    .sizes { display: flex; gap: 18px; align-items: end; flex-wrap: wrap; margin-top: 22px; }
    .sizes figure { margin: 0; }
    .sizes figcaption { font-size: 12px; color: var(--color-muted); margin-top: 6px; }
    .dark figcaption { color: var(--color-mist); }
    h2 { font-family: "Noto Serif TC", serif; font-size: 22px; margin: 36px 0 8px; }
  </style>
</head>
<body>
  <main class="wrap">
    <p class="banner">標誌提案 · 待東主確認 · 未核定</p>
    <h1>門印</h1>
    <p>圓角方印入面係一道門同門檻，門中一點銅色。門口代表辦館，門檻係田野地平線，銅點係車燈，亦係田上嘅光。配合文字標誌「救恩辦館 / KAU YAN STORE」一齊用。此頁只供東主審視，並非已核准標誌。</p>
    <div class="stage">
      <section class="card light" aria-label="淺色背景橫式標誌">
        <img class="lock" src="lockup.svg" alt="淺色背景上的救恩辦館橫式標誌提案" />
      </section>
      <section class="card dark" aria-label="深色背景橫式標誌">
        <img class="lock" src="lockup-on-dark.svg" alt="深色背景上的救恩辦館橫式標誌提案" />
      </section>
    </div>
    <h2>由細到大</h2>
    <div class="sizes">
      <figure><img src="mark.svg" width="16" height="16" alt=""><figcaption>16</figcaption></figure>
      <figure><img src="mark.svg" width="24" height="24" alt=""><figcaption>24</figcaption></figure>
      <figure><img src="mark.svg" width="32" height="32" alt=""><figcaption>32</figcaption></figure>
      <figure><img src="mark.svg" width="48" height="48" alt=""><figcaption>48</figcaption></figure>
      <figure><img src="mark.svg" width="80" height="80" alt=""><figcaption>80</figcaption></figure>
      <figure><img src="mark.svg" width="128" height="128" alt="門印放大"><figcaption>128</figcaption></figure>
    </div>
    <div class="card dark" style="margin-top:18px; min-height:0;">
      <div class="sizes">
        <figure><img src="mark-on-dark.svg" width="32" height="32" alt=""><figcaption>32</figcaption></figure>
        <figure><img src="mark-on-dark.svg" width="64" height="64" alt=""><figcaption>64</figcaption></figure>
        <figure><img src="mark-on-dark.svg" width="128" height="128" alt="深色版本門印"><figcaption>128</figcaption></figure>
        <figure><img src="wordmark-on-dark.svg" width="240" alt="深色文字標誌"><figcaption>Wordmark</figcaption></figure>
      </div>
    </div>
  </main>
</body>
</html>
